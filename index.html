<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baixador Universal</title>
    <style>
        body {
            background-color: #121212;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 255, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-top: 0; letter-spacing: 1px; }
        p { font-size: 12px; color: #aaaaaa; margin-bottom: 20px; }
        input[type="url"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0d0d0d;
            border: 1px solid #00FF00;
            color: #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        #customInstance {
            border: 1px dashed #555;
            color: #888;
            font-size: 11px;
            padding: 8px;
        }
        input[type="url"]:focus, select:focus {
            outline: none;
            box-shadow: 0 0 8px #00FF00;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #00FF00;
            color: #000000;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            transition: 0.2s;
            font-family: inherit;
        }
        button:active { background-color: #00cc00; transform: scale(0.98); }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status {
            margin-top: 15px;
            font-size: 13px;
            word-wrap: break-word;
            min-height: 20px;
            text-align: left;
        }
        .assinatura {
            margin-top: 25px;
            color: #FF3333;
            font-weight: bold;
            font-size: 15px;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>BAIXADOR UNIVERSAL</h2>
        <p>Suporta YouTube, Instagram, TikTok, Kwai, X</p>

        <input type="url" id="linkInput" placeholder="Cole o link do vídeo aqui..." required autocomplete="off">

        <select id="formatSelect">
            <option value="video">Baixar Vídeo (MP4)</option>
            <option value="audio">Baixar Apenas Áudio (MP3)</option>
        </select>

        <input type="url" id="customInstance" placeholder="Sua própria API (opcional): https://sua-api.app/" autocomplete="off">

        <button onclick="baixarMidia()" id="btnBaixar">Baixar Agora</button>

        <div id="status"></div>

        <div class="assinatura">Criado por OCruel</div>
    </div>

    <script>
        // Salva a instância própria quando o usuário digita
        document.getElementById('customInstance').addEventListener('change', (e) => {
            localStorage.setItem('cobaltInstance', e.target.value.trim());
        });
        document.getElementById('customInstance').value = localStorage.getItem('cobaltInstance') || '';

        async function baixarMidia() {
            const link = document.getElementById('linkInput').value.trim();
            const format = document.getElementById('formatSelect').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btnBaixar');
            const custom = localStorage.getItem('cobaltInstance') || '';

            if (!link) {
                statusDiv.innerHTML = "⚠️ Cole um link válido antes de baixar!";
                statusDiv.style.color = "#FF3333";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processando...";
            statusDiv.style.color = "#00FF00";

            // Sua instância (se configurada) tem prioridade; depois, públicas SEM Turnstile
            const servidores = [custom, "https://cobaltapi.cjs.nz/"].filter(Boolean);
            const erros = [];
            let sucesso = false;

            for (let apiUrl of servidores) {
                let host;
                try { host = new URL(apiUrl).host; } catch { host = apiUrl; }
                statusDiv.innerHTML = "🔄 Tentando servidor: " + host + "...";

                try {
                    const response = await fetch(apiUrl, {
                        method: "POST",
                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            url: link,
                            downloadMode: format === 'audio' ? 'audio' : 'auto',
                            audioFormat: "mp3",
                            youtubeVideoCodec: "h264",
                            filenameStyle: "pretty"
                        })
                    });

                    let data = null;
                    try { data = await response.json(); } catch {}

                    if (!response.ok) {
                        erros.push(host + ": HTTP " + response.status + " (" + (data?.error?.code || "acesso negado") + ")");
                        continue;
                    }

                    if (data.status === "error" || (!data.url && !data.picker)) {
                        erros.push(host + ": " + (data?.error?.code || "resposta inválida"));
                        continue;
                    }

                    // Pega o link direto (ou o primeiro item, se for lista/picker)
                    const fileUrl = data.url || (data.picker && data.picker[0].url);
                    if (!fileUrl) { erros.push(host + ": sem URL de mídia"); continue; }

                    statusDiv.innerHTML = "✅ Mídia encontrada! Baixando arquivo...";

                    // Baixa via Blob para forçar o save (não abre no player)
                    try {
                        const fileResponse = await fetch(fileUrl);
                        const blob = await fileResponse.blob();
                        const ext = format === 'audio' ? 'mp3' : 'mp4';
                        const nome = data.filename || ("baixador_universal_" + Date.now() + "." + ext);
                        const downloadUrl = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = nome;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(downloadUrl);
                    } catch (e) {
                        // Se o CORS bloquear o arquivo, abre em nova aba como plano B
                        window.open(fileUrl, "_blank");
                    }

                    setTimeout(() => { document.getElementById('linkInput').value = ''; }, 2000);
                    sucesso = true;
                    break;
                } catch (error) {
                    erros.push(host + ": bloqueado por CORS ou offline");
                    console.error("Falha em " + host + ":", error);
                }
            }

            if (!sucesso) {
                statusDiv.style.color = "#FF3333";
                statusDiv.innerHTML = "❌ Nenhum servidor funcionou:<br>• " + erros.join("<br>• ") +
                    "<br><br>💡 Solução definitiva: hospede sua própria API e cole no campo 'Sua própria API'.";
            }

            btn.disabled = false;
            btn.innerText = "Baixar Agora";
        }
    </script>
</body>
</html>
