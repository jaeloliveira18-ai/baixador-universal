<script>
        async function baixarMidia() {
            const link = document.getElementById('linkInput').value.trim();
            const format = document.getElementById('formatSelect').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btnBaixar');

            if (!link) {
                statusDiv.innerHTML = "⚠️ Cole um link válido antes de baixar!";
                statusDiv.style.color = "#FF3333";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processando...";
            statusDiv.innerHTML = "Conectando aos servidores globais...";
            statusDiv.style.color = "#00FF00";

            // Usando um Proxy para burlar o bloqueio de segurança do GitHub Pages
            // E utilizando a nova rota oficial (V7) do Cobalt
            const apiUrl = "https://corsproxy.io/?https://api.cobalt.tools/";
            
            // Configura os dados do pedido no novo padrão
            const requestData = { url: link };
            if (format === 'audio') {
                requestData.downloadMode = 'audio'; // Novo comando para extrair apenas áudio
            }
            
            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (data.url) {
                    statusDiv.innerHTML = "✅ Download liberado! O arquivo está sendo salvo.";
                    window.location.href = data.url; // Inicia o download
                    
                    setTimeout(() => {
                        document.getElementById('linkInput').value = '';
                    }, 2000);
                } else {
                    statusDiv.innerHTML = "❌ Erro no servidor: Link não suportado ou privado.";
                    statusDiv.style.color = "#FF3333";
                }
            } catch (error) {
                statusDiv.innerHTML = "❌ O servidor recusou o download. Tente novamente.";
                statusDiv.style.color = "#FF3333";
            } finally {
                btn.disabled = false;
                btn.innerText = "Baixar Agora";
            }
        }
    </script>
