<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baixador Universal</title>
    <style>
        body {
            background-color: #121212;
            color: #00FF00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 255, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }
        h2 { 
            margin-top: 0; 
            letter-spacing: 1px;
        }
        p {
            font-size: 12px;
            color: #aaaaaa;
            margin-bottom: 20px;
        }
        input[type="url"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0d0d0d;
            border: 1px solid #00FF00;
            color: #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input[type="url"]:focus, select:focus {
            outline: none;
            box-shadow: 0 0 8px #00FF00;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #00FF00;
            color: #000000;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            transition: 0.2s;
            font-family: inherit;
        }
        button:active { 
            background-color: #00cc00; 
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status { 
            margin-top: 15px; 
            font-size: 14px; 
            word-wrap: break-word; 
            min-height: 20px;
        }
        .assinatura {
            margin-top: 25px;
            color: #FF3333;
            font-weight: bold;
            font-size: 15px;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>BAIXADOR UNIVERSAL</h2>
        <p>Suporta YouTube, Instagram, TikTok, Kwai, X</p>
        
        <input type="url" id="linkInput" placeholder="Cole o link do vídeo aqui..." required autocomplete="off">
        
        <select id="formatSelect">
            <option value="video">Baixar Vídeo (MP4)</option>
            <option value="audio">Baixar Apenas Áudio (MP3)</option>
        </select>
        
        <button onclick="baixarMidia()" id="btnBaixar">Baixar Agora</button>
        
        <div id="status"></div>
        
        <div class="assinatura">Criado por OCruel</div>
    </div>

    <script>
        async function baixarMidia() {
            const link = document.getElementById('linkInput').value.trim();
            const format = document.getElementById('formatSelect').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btnBaixar');

            if (!link) {
                statusDiv.innerHTML = "⚠️ Cole um link válido antes de baixar!";
                statusDiv.style.color = "#FF3333";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processando...";
            statusDiv.innerHTML = "Buscando nos servidores globais...";
            statusDiv.style.color = "#00FF00";

            // Endpoints atualizados e proxies CORS conhecidos
            const servidores = [
                "https://api.cobalt.tools/",       // API Oficial (V10)
                "https://cobalt-api.kwiatek.xyz/", // Instância pública comunitária
                "https://cobalt.api horizn.cloud/" // Backup
            ];

            let sucesso = false;

            for (let apiUrl of servidores) {
                if (sucesso) break;
                
                try {
                    // Requisição padrão da API v10+ do Cobalt
                    const response = await fetch(apiUrl, {
                        method: "POST",
                        headers: {
                            "Accept": "application/json",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            url: link,
                            downloadMode: format === 'audio' ? 'audio' : 'auto',
                            audioFormat: "mp3",
                            filenameStyle: "basic",
                            youtubeVideoCodec: "h264"
                        })
                    });

                    const data = await response.json();
                    console.log(`Resposta de ${apiUrl}:`, data);

                    // Erro de API (ex: link inválido, servidor sem API key)
                    if (data.status === "error" || !data.url) {
                        console.warn(`Erro na API ${apiUrl}:`, data);
                        continue; 
                    }

                    if (data.url) {
                        statusDiv.innerHTML = "✅ Download liberado! Baixando arquivo...";
                        
                        // Download via Blob para não abrir o vídeo no navegador
                        const fileResponse = await fetch(data.url);
                        const blob = await fileResponse.blob();
                        const downloadUrl = window.URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = `baixador_universal_${Date.now()}.${format === 'audio' ? 'mp3' : 'mp4'}`;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(downloadUrl);
                        
                        setTimeout(() => {
                            document.getElementById('linkInput').value = '';
                        }, 2000);
                        
                        sucesso = true;
                    }
                } catch (error) {
                    // Isso mostra no console do navegador (F12) o motivo real da falha (CORS ou 404)
                    console.error(`Falha ao conectar com ${apiUrl}:`, error);
                    continue;
                }
            }

            if (!sucesso) {
                statusDiv.innerHTML = "❌ Erro: As APIs públicas estão bloqueadas. Pressione F12 para ver o motivo.";
                statusDiv.style.color = "#FF3333";
            }

            btn.disabled = false;
            btn.innerText = "Baixar Agora";
        }
    </script>
</body>
</html>
